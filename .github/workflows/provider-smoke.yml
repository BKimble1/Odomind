name: Provider smoke test

# Checks that NHTSA vPIC is reachable and still returns the fields Odomind
# reads. Deliberately NOT part of the pull-request gate: a government API having
# a bad afternoon must never turn every contributor's pull request red. The app
# is expected to work offline, and the provider tests in the main suite run
# against recorded fixtures.

on:
  workflow_dispatch:
  schedule:
    # Once a week, early on Monday UTC.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: provider-smoke
  cancel-in-progress: false

jobs:
  vpic:
    name: NHTSA vPIC availability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Decode a sample VIN
        id: decode
        continue-on-error: true
        run: ./.github/scripts/check-vpic.py

      - name: Report
        run: |
          outcome="${{ steps.decode.outcome }}"
          {
            echo "### NHTSA vPIC"
            echo ""
            if [ "$outcome" = "success" ]; then
              echo "Reachable, and still returning every field Odomind's decoder reads."
            else
              echo "Not reachable, or the response shape changed. See the step log above."
              echo ""
              echo "This does not fail the build. Odomind treats VIN decoding as optional and"
              echo "falls back to manual vehicle entry whenever the provider is unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build3:
    name: Build 3 capability probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Reports rather than gates. The point is evidence about what each
      # provider actually returns, gathered somewhere that can reach them —
      # the authoring host's egress allows GitHub and nothing else.
      - name: Probe every capability Build 3 needs
        id: probe
        continue-on-error: true
        run: ./.github/scripts/probe-providers.py | tee "$RUNNER_TEMP/probe.log"

      - name: Report
        if: always()
        run: |
          {
            echo "### Build 3 provider probe"
            echo ""
            echo '```'
            sed -n '/=== summary ===/,$p' "$RUNNER_TEMP/probe.log" 2>/dev/null || echo "probe produced no summary"
            echo '```'
            echo ""
            echo "<details><summary>Full probe output</summary>"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/probe.log" 2>/dev/null || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  matrix:
    name: Build 3 validation matrix
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      # Half the matrix is what the providers say. Reported, never gated: a
      # government API having a bad afternoon is not a build failure.
      - name: Ask every provider what it has for the three configurations
        id: providers
        continue-on-error: true
        run: ./.github/scripts/validation-matrix.py | tee "$RUNNER_TEMP/matrix.log"

      # The other half is what Odomind itself would build for them, produced
      # by the real code path rather than by describing it.
      - name: Ask Odomind what it would build for each
        continue-on-error: true
        run: |
          set -o pipefail
          catalog=OdomindCore/Sources/OdomindCore/Resources/odomind-catalog.json
          {
            swift run --package-path OdomindCore odomind-catalog vehicle "$catalog" \
              --year 2010 --make Jeep --model Wrangler \
              --powertrain gasoline --displacement 3.8
            echo ""
            swift run --package-path OdomindCore odomind-catalog vehicle "$catalog" \
              --year 2015 --make Toyota --model Camry \
              --powertrain gasoline --displacement 2.5
            echo ""
            swift run --package-path OdomindCore odomind-catalog vehicle "$catalog" \
              --year 2018 --make Ford --model "F-150" \
              --powertrain gasoline --displacement 3.5
          } 2>&1 | tee "$RUNNER_TEMP/catalog.log"

      # Repeated to stdout as well as to the step summary, and last, because
      # a job log is the only channel off a runner this repository can read
      # and only its tail is cheap to fetch. The summary was landing two
      # hundred lines above the end.
      - name: Say it again at the end of the log
        if: always()
        run: |
          echo "=== matrix summary, repeated for the log tail ==="
          sed -n '/=== summary ===/,$p' "$RUNNER_TEMP/matrix.log" 2>/dev/null || echo "no summary"
          echo "=== what each provider spells things ==="
          grep -E "fueleconomy.gov (lists|spells|does not list)|exact name match|no exact name|NO MATCH" \
            "$RUNNER_TEMP/matrix.log" 2>/dev/null || echo "no spelling lines"

      - name: Report
        if: always()
        run: |
          {
            echo "### Build 3 validation matrix"
            echo ""
            echo "#### What the providers returned"
            echo '```'
            sed -n '/=== summary ===/,$p' "$RUNNER_TEMP/matrix.log" 2>/dev/null || echo "no provider summary"
            echo '```'
            echo ""
            echo "<details><summary>Full provider output</summary>"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/matrix.log" 2>/dev/null || true
            echo '```'
            echo "</details>"
            echo ""
            echo "#### What Odomind would build"
            echo '```'
            cat "$RUNNER_TEMP/catalog.log" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  index:
    name: Build the vehicle suggestion index
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Emits the index to the log, gzipped and base64-encoded, because a job
      # log is the only channel out of a runner the authoring host can read.
      # `.github/scripts/decode-index.py` reassembles it.
      - name: Generate from vPIC
        run: ./.github/scripts/build-vehicle-index.py

      - name: Note
        if: always()
        run: |
          {
            echo "### Vehicle suggestion index"
            echo ""
            echo "Generated from vPIC's public make and model endpoints."
            echo "Reassemble with \`.github/scripts/decode-index.py\`."
          } >> "$GITHUB_STEP_SUMMARY"
