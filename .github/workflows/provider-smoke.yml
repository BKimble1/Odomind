name: Provider smoke test

# Checks that NHTSA vPIC is reachable and still returns the fields Odomind
# reads. Deliberately NOT part of the pull-request gate: a government API having
# a bad afternoon must never turn every contributor's pull request red. The app
# is expected to work offline, and the provider tests in the main suite run
# against recorded fixtures.

on:
  workflow_dispatch:
  schedule:
    # Once a week, early on Monday UTC.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: provider-smoke
  cancel-in-progress: false

jobs:
  vpic:
    name: NHTSA vPIC availability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Decode a sample VIN
        id: decode
        continue-on-error: true
        run: ./.github/scripts/check-vpic.py

      - name: Report
        run: |
          outcome="${{ steps.decode.outcome }}"
          {
            echo "### NHTSA vPIC"
            echo ""
            if [ "$outcome" = "success" ]; then
              echo "Reachable, and still returning every field Odomind's decoder reads."
            else
              echo "Not reachable, or the response shape changed. See the step log above."
              echo ""
              echo "This does not fail the build. Odomind treats VIN decoding as optional and"
              echo "falls back to manual vehicle entry whenever the provider is unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build3:
    name: Build 3 capability probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Reports rather than gates. The point is evidence about what each
      # provider actually returns, gathered somewhere that can reach them —
      # the authoring host's egress allows GitHub and nothing else.
      - name: Probe every capability Build 3 needs
        id: probe
        continue-on-error: true
        run: ./.github/scripts/probe-providers.py | tee "$RUNNER_TEMP/probe.log"

      - name: Report
        if: always()
        run: |
          {
            echo "### Build 3 provider probe"
            echo ""
            echo '```'
            sed -n '/=== summary ===/,$p' "$RUNNER_TEMP/probe.log" 2>/dev/null || echo "probe produced no summary"
            echo '```'
            echo ""
            echo "<details><summary>Full probe output</summary>"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/probe.log" 2>/dev/null || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  index:
    name: Build the vehicle suggestion index
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Emits the index to the log, gzipped and base64-encoded, because a job
      # log is the only channel out of a runner the authoring host can read.
      # `.github/scripts/decode-index.py` reassembles it.
      - name: Generate from vPIC
        run: ./.github/scripts/build-vehicle-index.py

      - name: Note
        if: always()
        run: |
          {
            echo "### Vehicle suggestion index"
            echo ""
            echo "Generated from vPIC's public make and model endpoints."
            echo "Reassemble with \`.github/scripts/decode-index.py\`."
          } >> "$GITHUB_STEP_SUMMARY"
