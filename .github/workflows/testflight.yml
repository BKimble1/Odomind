name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'New build number (positive integer; higher than previous uploads)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: odomind-testflight
  cancel-in-progress: false

jobs:
  verify:
    name: Require passing CI for this commit
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check build number and CI
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          number = os.environ['BUILD_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]{0,3}', number):
              raise SystemExit('Use a build number from 1 through 9999.')
          url = (f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                 f"/actions/workflows/ci.yml/runs?head_sha={os.environ['GITHUB_SHA']}&per_page=100")
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response)['workflow_runs']
          runs = [r for r in runs if r['head_sha'] == os.environ['GITHUB_SHA']
                  and r['event'] in ('push', 'workflow_dispatch')]
          if not runs:
              raise SystemExit('Run CI for this default-branch commit first, then run TestFlight again.')
          latest = max(runs, key=lambda r: r['id'])
          if latest['conclusion'] != 'success':
              raise SystemExit('CI must finish successfully first: ' + latest['html_url'])
          print('Passing CI: ' + latest['html_url'])
          PY

  upload:
    name: Sign and upload Odomind
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    environment: testflight
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select stable Xcode 26 or newer
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, re, subprocess
          candidates = []
          for app in pathlib.Path('/Applications').glob('Xcode*.app'):
              if re.search(r'beta|rc', app.name, re.I):
                  continue
              try:
                  with (app / 'Contents/version.plist').open('rb') as f:
                      version = plistlib.load(f)['CFBundleShortVersionString']
                  parts = tuple(map(int, version.split('.')))
              except (OSError, KeyError, ValueError):
                  continue
              if parts[0] >= 26:
                  candidates.append((parts, str(app / 'Contents/Developer')))
          if not candidates:
              raise SystemExit('No stable Xcode 26+ installed. Update the runner image before uploading.')
          _, developer = max(candidates)
          subprocess.run(['sudo', 'xcode-select', '--switch', developer], check=True)
          subprocess.run(['xcodebuild', '-version'], check=True)
          PY

      - name: Install and validate signing credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: bash .github/scripts/testflight.sh prepare

      - name: Archive and export
        run: bash .github/scripts/testflight.sh archive

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bash .github/scripts/testflight.sh upload

      - name: Remove temporary credentials
        if: always()
        run: bash .github/scripts/testflight.sh cleanup
