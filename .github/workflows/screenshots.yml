name: Screenshots

# Captures the app running in a simulator and publishes the result two ways:
# as a downloadable artifact, and — because artifact downloads are not
# reachable from every environment this repository gets worked on from — as a
# base64 copy in the log of a small job per screen, which can be reassembled
# with `.github/scripts/decode-screenshot.py`.
#
# Deliberately manual. It is a way to look at the app, not a gate, so it never
# runs on a push and never blocks a pull request.
on:
  workflow_dispatch:
    inputs:
      quality:
        description: "JPEG quality for the log copies (1-100). Lower is smaller."
        required: false
        default: "50"
      width:
        description: "Pixel width for the log copies."
        required: false
        default: "430"
      screens:
        description: >
          Space-separated capture names to put in the log, e.g.
          "light-01-home light-03b-parts". Blank emits every one.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture the running app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Discover a simulator
        id: simulator
        run: ./.github/scripts/select-simulator.sh

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Odomind.xcodeproj \
            -scheme Odomind \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      # Reported, not gated. A capture chain that fails one assert has still
      # captured everything before it, and throwing those away leaves nothing
      # to look at and nothing to diagnose from.
      - name: Capture
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Odomind.xcodeproj \
            -scheme Odomind \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:OdomindUITests/OdomindScreenshotTests \
            -resultBundlePath "$RUNNER_TEMP/screens.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/screens.log"

      - name: Say what failed, if anything did
        if: always()
        run: ./.github/scripts/test-failures.sh "$RUNNER_TEMP/screens.log" || true

      - name: Name and shrink the captures
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots" "$RUNNER_TEMP/small"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/screens.xcresult" \
            --output-path "$RUNNER_TEMP/screenshots"
          python3 .github/scripts/name-screenshots.py "$RUNNER_TEMP/screenshots"

          for source in "$RUNNER_TEMP"/screenshots/*.png; do
            [ -e "$source" ] || continue
            name=$(basename "$source" .png)
            sips --resampleWidth "${{ inputs.width }}" \
                 -s format jpeg \
                 -s formatOptions "${{ inputs.quality }}" \
                 "$source" --out "$RUNNER_TEMP/small/$name.jpg" >/dev/null
          done
          ls -l "$RUNNER_TEMP/small"

      # Both uploads are best-effort. They are for somebody looking at the run
      # in a browser; the authoring host cannot reach an artifact at all, which
      # is what the emit step below is for. The full-size upload in particular
      # fails whenever xcresult exports a debug-description file whose name
      # carries a double quote, and that must not take the run down with it.
      - name: Upload the full-size screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: ${{ runner.temp }}/screenshots
          retention-days: 14
          if-no-files-found: error

      - name: Upload the small copies
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-small-${{ github.run_id }}
          path: ${{ runner.temp }}/small
          retention-days: 14
          if-no-files-found: error

      # Reading these back means pulling the tail of this log, because a job
      # log is the only channel out of a runner this repository can read —
      # artifact downloads resolve to blob storage, which the authoring host's
      # egress policy denies. Emitting all thirty-one puts the interesting ones
      # hundreds of lines deep, so `screens` narrows the set and the chosen
      # ones land at the end where a short tail reaches them.
      - name: Emit captures into the log
        if: always()
        run: |
          shopt -s nullglob
          wanted="${{ inputs.screens }}"
          if [ -z "$wanted" ]; then
            files=("$RUNNER_TEMP"/small/*.jpg)
          else
            files=()
            for name in $wanted; do
              if [ -f "$RUNNER_TEMP/small/$name.jpg" ]; then
                files+=("$RUNNER_TEMP/small/$name.jpg")
              else
                echo "IMGMISS:$name"
              fi
            done
          fi
          for file in "${files[@]}"; do
            name=$(basename "$file" .jpg)
            echo "IMGSTART:$name:$(wc -c < "$file" | tr -d ' ')"
            base64 -i "$file" | fold -w 2400 | awk '{printf "IMG:%04d:%s\n", NR, $0}'
            echo "IMGEND:$name"
          done

  small-display:
    name: Capture on the smallest iPhone
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      # The narrowest supported phone rather than the newest. Build 3's Home
      # pins an action bar above the tab bar and puts a segmented control
      # under the search field; both are the kind of thing that fits on a Pro
      # and clips on an SE.
      - name: Discover the smallest simulator
        id: simulator
        env:
          SIMULATOR_SIZE: small
        run: ./.github/scripts/select-simulator.sh

      # Named in the log, because "the smallest supported display" is a claim
      # about which device this ran on and the runner image decides that.
      - name: Say which device this is
        run: echo "SMALLDEVICE:${{ steps.simulator.outputs.device }}"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Odomind.xcodeproj \
            -scheme Odomind \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -30

      - name: Capture
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Odomind.xcodeproj \
            -scheme Odomind \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:OdomindUITests/OdomindScreenshotTests \
            -resultBundlePath "$RUNNER_TEMP/screens.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/screens.log" | tail -40

      # `tail` kept the log short and threw away the assertion with it. One
      # failed test on an SE told me nothing at all last run.
      - name: Say what failed, if anything did
        if: always()
        run: ./.github/scripts/test-failures.sh "$RUNNER_TEMP/screens.log" || true

      # Emitted from this job rather than through an artifact, because the
      # only channel out of a runner this repository can read from is the log.
      - name: Emit the screens most likely to clip
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots" "$RUNNER_TEMP/small"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/screens.xcresult" \
            --output-path "$RUNNER_TEMP/screenshots"
          python3 .github/scripts/name-screenshots.py "$RUNNER_TEMP/screenshots"

          for name in light-01-home build3-04-home light-04-garage build3-03-configuration build3-03b-picked build3-04b-jobs build3-05-parts-from-a-job build3-07-garage; do
            source=$(find "$RUNNER_TEMP/screenshots" -maxdepth 1 -type f -name "$name*.png" | sort | head -1)
            if [ -z "$source" ]; then
              echo "IMGMISS:small-$name"
              continue
            fi
            sips --resampleWidth "${{ inputs.width }}" \
                 -s format jpeg \
                 -s formatOptions "${{ inputs.quality }}" \
                 "$source" --out "$RUNNER_TEMP/small/$name.jpg" >/dev/null
            echo "IMGSTART:small-$name:$(wc -c < "$RUNNER_TEMP/small/$name.jpg" | tr -d ' ')"
            base64 -i "$RUNNER_TEMP/small/$name.jpg" | fold -w 2400 | awk '{printf "IMG:%04d:%s\n", NR, $0}'
            echo "IMGEND:small-$name"
          done
